<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Seriecita</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1 id="heading">Seriecita</h1>

    <section>
      <h2 id="language-heading">Language</h2>
      <select id="locale-select">
        <option value="auto" id="locale-auto-option">Auto-detect</option>
        <option value="ko">한국어</option>
        <option value="en">English</option>
      </select>
    </section>

    <section>
      <h2 id="api-key-heading">Google Books API key (optional)</h2>
      <p class="hint" id="api-key-hint"></p>
      <input id="api-key" type="text" autocomplete="off" />
      <div class="actions">
        <button id="save"></button>
        <span id="status"></span>
      </div>
    </section>

    <script src="options.js"></script>
  </body>
</html>
